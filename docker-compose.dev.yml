# ============================================================================
# CareerOS — development overrides.
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#
# Adds source-code volume mounts, reload-friendly processes, debug logging and
# optional connectivity to a local model runtime on the host.
# ============================================================================

services:
  qdrant:
    # Named volume persists between restarts; wipe with `make clean`.
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    volumes:
      - ./backend:/app
      - ./data:/app/data
      - ./scripts:/app/scripts
    environment:
      LOG_LEVEL: DEBUG
      ENABLE_DEBUG_ENDPOINTS: "true"
      APP_ENV: development
      # Reach a host-run LLM (Ollama, llama.cpp server, LM Studio, ...).
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:11434/v1}
    # --reload watches mounted source and restarts on change.
    command: >
      uvicorn app.main:app
      --host 0.0.0.0 --port 8000
      --reload --reload-dir /app/app

  frontend:
    volumes:
      - ./frontend/app.py:/app/app.py
      - ./frontend/.streamlit:/app/.streamlit
    environment:
      BACKEND_URL: http://backend:8000
      APP_ENV: development
    # runOnSave reloads the page when the mounted source changes.
    command: >
      streamlit run app.py
      --server.address 0.0.0.0
      --server.port 8501
      --server.runOnSave true
      --server.headless true
