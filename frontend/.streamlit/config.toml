# CareerOS frontend — Streamlit configuration
[theme]
base = "light"
primaryColor = "#2563eb"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f1f5f9"
textColor = "#0f172a"
font = "sans serif"

[server]
headless = true
address = "0.0.0.0"
port = 8501
enableXsrfProtection = true
maxUploadSize = 10

[browser]
gatherUsageStats = false
