[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "careeros"
version = "1.0.0"
description = "CareerOS — a citation-grounded RAG assistant for exploring Vedant Sawant's projects, skills, and hackathon experience."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Vedant Sawant" }]
keywords = ["rag", "fastapi", "qdrant", "career-assistant", "retrieval-augmented-generation"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "httpx>=0.27",
  "mypy>=1.10",
]

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-dir]
app = "backend/app"

# ----------------------------------------------------------------------------
# Ruff — linting and formatting
# ----------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["backend/app", "scripts", "tests"]
exclude = [".git", "__pycache__", ".venv", "qdrant_storage"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # import sorting
  "B",   # bugbear
  "UP",  # pyupgrade
  "SIM", # simplify
  "C4",  # comprehensions
]
ignore = [
  "B008",   # FastAPI Depends() in defaults is idiomatic
  "SIM108", # ternary operator rewrites are not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"frontend/*" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ----------------------------------------------------------------------------
# Pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "."]
addopts = "-ra --strict-markers"
markers = [
  "integration: tests that exercise Qdrant / pipeline wiring with mocks",
  "api: FastAPI endpoint tests",
]
filterwarnings = ["ignore::DeprecationWarning"]

# ----------------------------------------------------------------------------
# MyPy (optional, practical subset)
# ----------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
mypy_path = "backend"
packages = ["app"]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = false

[[tool.mypy.overrides]]
module = ["app.retrieval.embeddings", "app.retrieval.reranker"]
ignore_errors = true
